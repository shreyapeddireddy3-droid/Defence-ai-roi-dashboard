<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Defence AI ROI Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card h2 {
            font-size: 28px;
        }

        .projects {
            margin-top: 30px;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #e5e7eb;
        }

        .roi {
            font-weight: bold;
        }

        input {
            padding: 8px;
            width: 120px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #1f2937;
            color: white;
        }

        @media (max-width: 700px) {
            .cards {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Defence AI ROI Dashboard</h1>
    <p>AI Project Investment & Return Analysis</p>
</header>

<div class="container">

    <div class="cards">

        <div class="card">
            <h3>Total Investment</h3>
            <h2 id="totalInvestment">₹0</h2>
        </div>

        <div class="card">
            <h3>Total Benefit</h3>
            <h2 id="totalBenefit">₹0</h2>
        </div>

        <div class="card">
            <h3>Overall ROI</h3>
            <h2 id="overallROI">0%</h2>
        </div>

    </div>

    <div class="projects">

        <h2>Defence AI Projects</h2>

        <table>

            <thead>
                <tr>
                    <th>Project</th>
                    <th>Investment (₹ Lakhs)</th>
                    <th>Benefit (₹ Lakhs)</th>
                    <th>ROI</th>
                </tr>
            </thead>

            <tbody id="projectTable">

                <tr>
                    <td>Predictive Maintenance</td>
                    <td><input type="number" value="10" class="investment"></td>
                    <td><input type="number" value="18" class="benefit"></td>
                    <td class="roi">0%</td>
                </tr>

                <tr>
                    <td>Surveillance AI</td>
                    <td><input type="number" value="20" class="investment"></td>
                    <td><input type="number" value="35" class="benefit"></td>
                    <td class="roi">0%</td>
                </tr>

                <tr>
                    <td>Logistics Optimization</td>
                    <td><input type="number" value="8" class="investment"></td>
                    <td><input type="number" value="16" class="benefit"></td>
                    <td class="roi">0%</td>
                </tr>

            </tbody>

        </table>

        <br>

        <button onclick="calculateROI()">Calculate ROI</button>

    </div>

</div>

<script>

function calculateROI() {

    const investments = document.querySelectorAll(".investment");
    const benefits = document.querySelectorAll(".benefit");
    const roiCells = document.querySelectorAll(".roi");

    let totalInvestment = 0;
    let totalBenefit = 0;

    for (let i = 0; i < investments.length; i++) {

        const investment = Number(investments[i].value);
        const benefit = Number(benefits[i].value);

        totalInvestment += investment;
        totalBenefit += benefit;

        let roi = 0;

        if (investment > 0) {
            roi = ((benefit - investment) / investment) * 100;
        }

        roiCells[i].textContent = roi.toFixed(1) + "%";
    }

    let overallROI = 0;

    if (totalInvestment > 0) {
        overallROI =
            ((totalBenefit - totalInvestment) / totalInvestment) * 100;
    }

    document.getElementById("totalInvestment").textContent =
        "₹" + totalInvestment.toFixed(1) + " Lakhs";

    document.getElementById("totalBenefit").textContent =
        "₹" + totalBenefit.toFixed(1) + " Lakhs";

    document.getElementById("overallROI").textContent =
        overallROI.toFixed(1) + "%";
}

calculateROI();

</script>
    <h2>ROI by Defence AI Project</h2>

<div style="max-width: 900px; margin: 30px auto;">
    <canvas id="roiChart"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
const projects = [
    "Predictive Maintenance",
    "Surveillance AI",
    "Logistics Optimization"
];

const investments = [18, 20, 8];
const benefits = [20, 35, 16];

const roiValues = investments.map((investment, index) => {
    return ((benefits[index] - investment) / investment * 100).toFixed(1);
});

new Chart(document.getElementById("roiChart"), {
    type: "bar",

    data: {
        labels: projects,

        datasets: [{
            label: "ROI (%)",
            data: roiValues
        }]
    },

    options: {
        responsive: true,

        scales: {
            y: {
                beginAtZero: true,
                title: {
                    display: true,
                    text: "ROI (%)"
                }
            },

            x: {
                title: {
                    display: true,
                    text: "Defence AI Projects"
                }
            }
        }
    }
});
</script>

</body>
</html>
